# Generated by scripts/build_plugin.py in the MemorySafe source repository. Edits made
# here are replaced by the next release.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: release-assets/${{ github.ref_name }}
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" memorysafe-claude-desktop.mcpb --clobber
          else
            prerelease=
            case "${TAG#v}" in *[!0-9.]*) prerelease=--prerelease ;; esac
            gh release create "$TAG" memorysafe-claude-desktop.mcpb --verify-tag $prerelease \
              --title "MemorySafe ${TAG#v}" --notes-file notes.md
          fi
      - name: Remove the asset branch
        env:
          TAG: ${{ github.ref_name }}
        run: git push origin --delete "release-assets/$TAG"
